name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Test tap
        run: |
          brew tap RhetTbull/osxphotos
          brew install --build-from-source RhetTbull/osxphotos/osxphotos
          osxphotos --version
          osxphotos --help

      - name: Test Rust extensions load
        run: |
          PYTHON="$(brew --prefix osxphotos)/libexec/bin/python"
          "$PYTHON" -c "import whenever._whenever; import whenever; whenever.Instant.now()"
          BITSTRING_USE_RUST_CORE=1 "$PYTHON" -c "import tibs, bitstring; bitstring.BitArray(uint=1, length=8)"
          "$PYTHON" -c "import bitstring; bitstring.BitArray(uint=1, length=8)"
